name: conecta_pvh
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_conectapvh.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_conectapvh.png"
  adaptive_icon_background: "#143D2B"
  adaptive_icon_foreground: "assets/images/logo_conectapvh.png"
